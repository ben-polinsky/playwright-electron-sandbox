name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libxdamage1 \
            libxrandr2 \
            libxshmfence1 \
            libxcb-dri3-0 \
            libnss3 \
            libxss1 \
            libxtst6
          for pkg in libatk1.0-0 libatk-bridge2.0-0 libcups2 libasound2 libgtk-3-0; do
            sudo apt-get install -y "$pkg" || sudo apt-get install -y "${pkg}t64"
          done
      - run: npm ci
      - name: Run tests
        run: npm test
