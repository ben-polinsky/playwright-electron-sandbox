name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t playwright-electron-sandbox-test .
      - name: Run tests inside container
        run: docker run --rm playwright-electron-sandbox-test
